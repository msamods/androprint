<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Print Jobs – AndroPrint</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#6366f1;--accent:#06b6d4;--bg:#0f0f23;--bg-card:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);--text:#e2e8f0;--text-dim:#64748b;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--radius:16px}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        .topbar{background:rgba(15,15,35,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);padding:12px 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px}
        .topbar-logo{width:38px;height:38px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
        .topbar h1{flex:1;font-size:1.15rem;font-weight:700}
        .back-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;transition:all 0.2s}
        .back-btn:hover{background:rgba(255,255,255,0.1);color:#fff}

        .main{max-width:900px;margin:0 auto;padding:20px}

        /* Stats */
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
        .stat-card{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;text-align:center}
        .stat-value{font-size:1.8rem;font-weight:800;letter-spacing:-0.03em}
        .stat-label{font-size:0.75rem;color:var(--text-dim);margin-top:4px;font-weight:500}

        /* Controls */
        .controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
        .filter-btn{padding:8px 16px;border-radius:10px;background:var(--bg-card);border:1px solid var(--glass-border);color:var(--text-dim);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif}
        .filter-btn:hover{background:rgba(255,255,255,0.08);color:#fff}
        .filter-btn.active{background:rgba(99,102,241,0.2);color:var(--primary);border-color:rgba(99,102,241,0.3)}
        .clear-btn{margin-left:auto;padding:8px 16px;border-radius:10px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.2);color:var(--danger);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif}
        .clear-btn:hover{background:rgba(239,68,68,0.2)}

        /* Job list */
        .card{background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden}
        .job-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.2s}
        .job-row:last-child{border-bottom:none}
        .job-row:hover{background:rgba(255,255,255,0.02)}

        .job-status-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
        .job-status-icon.success{background:rgba(16,185,129,0.15);color:var(--success)}
        .job-status-icon.failed{background:rgba(239,68,68,0.15);color:var(--danger)}

        .job-details{flex:1;min-width:0}
        .job-title{font-size:0.88rem;font-weight:600;margin-bottom:2px}
        .job-meta{font-size:0.75rem;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
        .job-meta span{display:flex;align-items:center;gap:4px}

        .job-time{font-size:0.75rem;color:var(--text-dim);white-space:nowrap;text-align:right}
        .job-time .date{display:block;font-size:0.7rem;opacity:0.7}

        .job-badge{padding:3px 10px;border-radius:8px;font-size:0.7rem;font-weight:600;flex-shrink:0}
        .job-badge.success{background:rgba(16,185,129,0.15);color:var(--success)}
        .job-badge.failed{background:rgba(239,68,68,0.15);color:var(--danger)}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
        .empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:0.4}

        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:14px;font-size:0.85rem;font-weight:500;z-index:9999;backdrop-filter:blur(20px);display:flex;align-items:center;gap:8px}
        .toast.success{background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.3);color:var(--success)}

        @media(max-width:480px){.stats-row{grid-template-columns:1fr 1fr}.job-meta{flex-direction:column;gap:2px}}
    </style>
</head>
<body>
    <div class="topbar">
        <a href="dashboard.html" class="back-btn">←</a>
        <div class="topbar-logo">📋</div>
        <h1>Print Jobs</h1>
    </div>

    <div class="main">
        <!-- Stats -->
        <div class="stats-row" id="jobStats">
            <div class="stat-card">
                <div class="stat-value" id="totalJobs" style="color:var(--primary)">0</div>
                <div class="stat-label">Total Jobs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successJobs" style="color:var(--success)">0</div>
                <div class="stat-label">Successful</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failedJobs" style="color:var(--danger)">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate" style="color:var(--accent)">-%</div>
                <div class="stat-label">Success Rate</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="controls">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" data-filter="success" onclick="setFilter('success', this)">✓ Success</button>
            <button class="filter-btn" data-filter="failed" onclick="setFilter('failed', this)">✗ Failed</button>
            <button class="filter-btn" data-filter="print" onclick="setFilter('print', this)">🖨️ Print</button>
            <button class="filter-btn" data-filter="test" onclick="setFilter('test', this)">🔧 Test</button>
            <button class="clear-btn" onclick="clearJobs()">🗑️ Clear All</button>
        </div>

        <!-- Job List -->
        <div class="card" id="jobsContainer">
            <div class="empty-state">
                <div class="icon">🔄</div>
                <div>Loading jobs...</div>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem("auth")) window.location.href = "index.html";

        let allJobs = [];
        let currentFilter = 'all';

        async function loadJobs() {
            try {
                const res = await fetch('/api/jobs?limit=200');
                const data = await res.json();
                allJobs = data.jobs || [];
                updateStats();
                renderJobs();
            } catch {
                document.getElementById('jobsContainer').innerHTML = `
                    <div class="empty-state"><div class="icon">⚠️</div><div>Failed to load jobs</div></div>
                `;
            }
        }

        function updateStats() {
            const success = allJobs.filter(j => j.status === 'success').length;
            const failed = allJobs.filter(j => j.status === 'failed').length;
            const total = allJobs.length;
            const rate = total > 0 ? Math.round((success / total) * 100) : 100;

            document.getElementById('totalJobs').textContent = total;
            document.getElementById('successJobs').textContent = success;
            document.getElementById('failedJobs').textContent = failed;
            document.getElementById('successRate').textContent = rate + '%';
        }

        function renderJobs() {
            const container = document.getElementById('jobsContainer');
            let jobs = allJobs;

            if (currentFilter === 'success') jobs = jobs.filter(j => j.status === 'success');
            else if (currentFilter === 'failed') jobs = jobs.filter(j => j.status === 'failed');
            else if (currentFilter === 'print') jobs = jobs.filter(j => j.type === 'print' || j.type === 'quickprint');
            else if (currentFilter === 'test') jobs = jobs.filter(j => j.type === 'test');

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <div>No print jobs found</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = jobs.map(j => {
                const time = new Date(j.timestamp);
                const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = time.toLocaleDateString([], { month: 'short', day: 'numeric' });

                return `
                    <div class="job-row">
                        <div class="job-status-icon ${j.status}">
                            ${j.status === 'success' ? '✓' : '✗'}
                        </div>
                        <div class="job-details">
                            <div class="job-title">${j.printerName || j.printerId || 'Unknown Printer'}</div>
                            <div class="job-meta">
                                <span>📋 ${j.type || 'print'}</span>
                                ${j.clientId ? `<span>👤 ${j.clientId}</span>` : ''}
                                ${j.textPreview ? `<span>📝 ${j.textPreview.substring(0, 40)}...</span>` : ''}
                                ${j.error ? `<span style="color:var(--danger)">⚠ ${j.error}</span>` : ''}
                            </div>
                        </div>
                        <span class="job-badge ${j.status}">${j.status}</span>
                        <div class="job-time">
                            ${timeStr}
                            <span class="date">${dateStr}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderJobs();
        }

        async function clearJobs() {
            if (!confirm('Clear all print job history?')) return;
            try {
                await fetch('/api/jobs/clear', { method: 'POST' });
                allJobs = [];
                updateStats();
                renderJobs();
                showToast('Job history cleared');
            } catch {
                showToast('Failed to clear', 'error');
            }
        }

        function showToast(msg) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const toast = document.createElement('div');
            toast.className = 'toast success';
            toast.innerHTML = `✓ ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // SSE for live updates
        const sse = new EventSource('/api/events');
        sse.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.type === 'job_update') loadJobs();
            } catch {}
        };

        loadJobs();
    </script>
</body>
</html>
