<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndroPrint – Cloud Print Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.06);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
        }

        .bg-glow-1 {
            top: -200px;
            right: -100px;
            background: var(--primary);
            animation: float1 8s ease-in-out infinite;
        }

        .bg-glow-2 {
            bottom: -200px;
            left: -100px;
            background: var(--accent);
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Login card */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 36px 40px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 8px 48px rgba(99, 102, 241, 0.5); }
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--text-dim) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .logo-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Server status */
        .server-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 100px;
            font-size: 0.78rem;
            color: var(--success);
            font-weight: 500;
            display: inline-flex;
        }

        .server-status .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .server-status.offline {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .server-status.offline .dot {
            background: var(--danger);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .form-input:focus {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .login-btn:hover::before {
            transform: translateX(100%);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* Error message */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-dim);
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--primary);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: particleFloat 6s linear infinite;
        }

        @keyframes particleFloat {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100px) scale(1); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px 32px;
                border-radius: 20px;
            }
            .logo-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Floating particles -->
    <div class="particle" style="left:10%;animation-delay:0s;animation-duration:8s;"></div>
    <div class="particle" style="left:25%;animation-delay:1s;animation-duration:6s;"></div>
    <div class="particle" style="left:40%;animation-delay:2s;animation-duration:9s;"></div>
    <div class="particle" style="left:55%;animation-delay:0.5s;animation-duration:7s;"></div>
    <div class="particle" style="left:70%;animation-delay:3s;animation-duration:8s;"></div>
    <div class="particle" style="left:85%;animation-delay:1.5s;animation-duration:10s;"></div>
    <div class="particle" style="left:15%;animation-delay:4s;animation-duration:7s;"></div>
    <div class="particle" style="left:60%;animation-delay:2.5s;animation-duration:9s;"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">🖨️</div>
                <div class="logo-title">AndroPrint</div>
                <div class="logo-subtitle">ESC/POS Cloud Print Server</div>
                <div style="text-align:center;margin-top:12px;">
                    <span class="server-status" id="serverStatus">
                        <span class="dot"></span>
                        <span id="statusText">Connecting...</span>
                    </span>
                </div>
            </div>

            <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" type="text" id="username" placeholder="Enter username" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" id="password" placeholder="Enter password" autocomplete="current-password">
            </div>

            <button class="login-btn" id="loginBtn" onclick="login()">
                Sign In to Dashboard
            </button>

            <div class="login-footer">
                <div>AndroPrint v2.0 • Secure Cloud Print Gateway</div>
                <div style="margin-top:6px; font-weight:600; color:var(--text); opacity:0.9;">Developed By : MSA MODS x WhatYouWantKerala</div>
            </div>
        </div>
    </div>

    <script>
        // Check server status
        async function checkServer() {
            const status = document.getElementById('serverStatus');
            const text = document.getElementById('statusText');
            try {
                const res = await fetch('/api/server');
                const data = await res.json();
                status.classList.remove('offline');
                text.textContent = `Server ${data.serverId} Online`;
            } catch {
                status.classList.add('offline');
                text.textContent = 'Server Offline';
            }
        }

        checkServer();
        setInterval(checkServer, 15000);

        // Auto-redirect if already logged in
        if (localStorage.getItem("auth") === "1") {
            window.location.href = "dashboard.html";
        }

        // Enter key support
        document.getElementById('password').addEventListener('keypress', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('username').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errorMsg');

            btn.classList.add('loading');
            btn.textContent = 'Authenticating...';
            err.style.display = 'none';

            setTimeout(() => {
                if (u === "admin" && p === "1231") {
                    localStorage.setItem("auth", "1");
                    btn.textContent = '✓ Welcome!';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 500);
                } else {
                    err.style.display = 'block';
                    btn.classList.remove('loading');
                    btn.textContent = 'Sign In to Dashboard';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            }, 600);
        }
    </script>
</body>
</html>
